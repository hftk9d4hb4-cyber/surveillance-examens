name: Qualité

on:
  pull_request:
  push:
    branches:
      - feature/v1.2-mp01-stabilisation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: surveillance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d surveillance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/surveillance_test?schema=public
      DATABASE_URL_UNPOOLED: postgresql://user:pass@localhost:5432/surveillance_test?schema=public
      NEXTAUTH_SECRET: ci-only-secret-ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:hygiene
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Recette imports et export statistique sur PostgreSQL isolé
        run: node scripts/validate-staff-import.mjs
